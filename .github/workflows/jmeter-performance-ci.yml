name: JMeter Performance Testing CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_api:
        description: 'Target API Suite to Test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - heroku
          - petstore
          - reqres
          - todoist
      users:
        description: 'Virtual Users (Threads)'
        required: true
        default: '5'
        type: string
      duration:
        description: 'Duration in seconds'
        required: true
        default: '60'
        type: string
      max_error_rate:
        description: 'Quality Gate: Max Allowed Error Rate (%)'
        required: true
        default: '10'
        type: string
      max_p95_ms:
        description: 'Quality Gate: Max Allowed P95 Latency (ms)'
        required: true
        default: '4000'
        type: string

permissions:
  contents: read

jobs:
  jmeter-performance-test:
    name: Run JMeter Performance Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ⚡ Cache Apache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: /opt/apache-jmeter-5.6.3
          key: jmeter-5.6.3-ubuntu

      - name: 🚀 Install Apache JMeter 5.6.3
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          JMETER_VERSION=5.6.3
          echo "Downloading Apache JMeter ${JMETER_VERSION}..."
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz
          tar -xzf apache-jmeter-${JMETER_VERSION}.tgz
          sudo mv apache-jmeter-${JMETER_VERSION} /opt/apache-jmeter-5.6.3
          rm apache-jmeter-${JMETER_VERSION}.tgz

      - name: 🔧 Add JMeter to PATH
        run: |
          echo "/opt/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

      - name: 📁 Prepare Directories
        run: |
          mkdir -p jmeter/results/html-report

      - name: 🧪 Execute JMeter Non-GUI Performance Test
        id: run-jmeter
        run: |
          TARGET="${{ github.event.inputs.target_api || 'all' }}"
          USERS="${{ github.event.inputs.users || '5' }}"
          DURATION="${{ github.event.inputs.duration || '60' }}"
          
          # Map Target to corresponding JMX file
          case "$TARGET" in
            heroku)
              JMX_FILE="jmeter/test-plans/Herokuapp_Performance_Test.jmx"
              ;;
            petstore)
              JMX_FILE="jmeter/test-plans/Petstore_Performance_Test.jmx"
              ;;
            reqres)
              JMX_FILE="jmeter/test-plans/ReqRes_Performance_Test.jmx"
              ;;
            todoist)
              JMX_FILE="jmeter/test-plans/Todoist_Performance_Test.jmx"
              ;;
            *)
              JMX_FILE="jmeter/test-plans/Full_Multi_API_Performance_Suite.jmx"
              ;;
          esac

          echo "=========================================================="
          echo "Executing JMeter Test Plan: $JMX_FILE"
          echo "Target API Suite          : $TARGET"
          echo "Virtual Users (VUs)       : $USERS"
          echo "Duration                  : ${DURATION}s"
          echo "=========================================================="

          jmeter -n -t "$JMX_FILE" \
                 -JUSERS="$USERS" \
                 -JDURATION="$DURATION" \
                 -JLOOP_COUNT=3 \
                 -JTODOIST_TOKEN="${{ secrets.TODOIST_BEARER_TOKEN || 'demo_token_placeholder' }}" \
                 -l "jmeter/results/result.jtl" \
                 -e -o "jmeter/results/html-report"
        continue-on-error: true

      - name: 📊 Generate Summary Report & Evaluate Quality Gate
        id: summary-report
        if: always()
        run: |
          MAX_ERR="${{ github.event.inputs.max_error_rate || '10' }}"
          MAX_P95="${{ github.event.inputs.max_p95_ms || '4000' }}"
          
          python3 jmeter/generate_summary_report.py "jmeter/results/result.jtl" "$MAX_ERR" "$MAX_P95"
        continue-on-error: true

      - name: 📤 Upload JMeter HTML Dashboard & JTL Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-dashboard-report
          path: |
            jmeter/results/html-report/
            jmeter/results/result.jtl
          retention-days: 14

      - name: ❌ Enforce Pipeline Quality Gate
        if: steps.run-jmeter.outcome == 'failure' || steps.summary-report.outcome == 'failure'
        run: |
          echo "::error::JMeter performance test failed SLA Quality Gate or encountered critical execution errors. Check the summary table above."
          exit 1
