name: k6 Performance Testing CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Loại k6 performance test cần chạy'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
      target_api:
        description: 'Bộ API mục tiêu cần test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - reqres
          - herokuapp
          - petstore
          - todoist

permissions:
  contents: write

jobs:
  k6-performance-test:
    name: Run k6 Performance Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🚀 Setup k6 CLI Engine
        uses: grafana/setup-k6-action@v1

      - name: 📁 Ensure Output Directory Exists
        run: |
          mkdir -p k6/results
          echo "# k6 Execution Pending" > k6/results/summary.md

      - name: ⚡ Execute k6 Performance Test
        id: run-k6
        run: |
          TEST_TYPE="${{ github.event.inputs.test_type || 'smoke' }}"
          TARGET_API="${{ github.event.inputs.target_api || 'all' }}"
          echo "Executing k6 test script: k6/scripts/${TEST_TYPE}-test.js for target API: ${TARGET_API}"
          
          k6 run \
            -e TARGET_API="${TARGET_API}" \
            -e TODOIST_BEARER_TOKEN="${TODOIST_BEARER_TOKEN}" \
            -e REQRES_API_KEY="${REQRES_API_KEY}" \
            k6/scripts/${TEST_TYPE}-test.js
        env:
          TARGET_API: ${{ github.event.inputs.target_api || 'all' }}
          TODOIST_BEARER_TOKEN: ${{ secrets.TODOIST_BEARER_TOKEN }}
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        continue-on-error: true

      - name: 📝 Publish k6 Step Summary to GitHub Dashboard
        if: always()
        run: |
          if [ -f k6/results/summary.md ]; then
            cat k6/results/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📊 k6 Performance Test Run Completed" >> $GITHUB_STEP_SUMMARY
            echo "Execution Outcome: \`${{ steps.run-k6.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload k6 HTML Dashboard & JSON Results to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-reports
          path: k6/results/
          retention-days: 30

      - name: ❌ Check Workflow Result
        if: steps.run-k6.outcome == 'failure'
        run: |
          echo "⚠️ k6 Performance Test completed with threshold violations or request failures."
          echo "Please review the Detailed Checks & Failure Diagnostics table above."
          exit 1
